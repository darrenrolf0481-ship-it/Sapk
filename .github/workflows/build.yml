name: Paranormal OS — APK Build

on:
  push:
    branches: [ "New" ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Compile Native Manifold
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Sync PWA Assets
        run: |
          mkdir -p app/src/main/assets
          cp index.html app/src/main/assets/ 2>/dev/null || true
          cp star-city-bridge.js app/src/main/assets/ 2>/dev/null || true
          cp sage-memory.js app/src/main/assets/ 2>/dev/null || true
          cp dual-brain-patch.js app/src/main/assets/ 2>/dev/null || true
          cp sage-modules.js app/src/main/assets/ 2>/dev/null || true
          cp puter-bridge.js app/src/main/assets/ 2>/dev/null || true

      - name: Grant Gradle Permission
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Paranormal-OS-SAGE7
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
